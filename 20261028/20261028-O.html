
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的迷你計算機</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
            background-color: #f8f1f8;
            font-family: "Microsoft JhengHei", sans-serif;
            color: #79547e;
        }

        /* 整體寬度 */
        .container {
            width: 100%;
            max-width: 360px;
            margin: auto;
        }

        /* 標題 */
        h1 {
            text-align: center;
            font-size: 26px;
            margin: 0;
            color: #79547e;
        }

        .subtitle {
            text-align: center;
            color: #b18bb8;
            margin-top: 12px;
            margin-bottom: 20px;
        }

        /* 白色輸入卡片 */
        .container-input {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 22px;
            box-shadow: 0 12px 28px rgba(120, 80, 130, 0.08);
        }

        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 16px;
            color: #79547e;
        }

        /* 輸入框和選單 */
        input, select {
            width: 100%;
            height: 45px;
            padding: 10px 14px;
            border: 1px solid #e3cfe4;
            border-radius: 11px;
            background-color: white;
            font-size: 16px;
            outline: none;
        }

        /* 點選輸入框效果 */
        input:focus, select:focus {
            border-color: #b18bb8;
            box-shadow: 0 0 0 3px rgba(177, 139, 184, 0.15);
        }

        /* 計算按鈕 */
        #myBtn {
            width: 100%;
            height: 54px;
            background-color: #b18bb8;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 滑鼠移到按鈕上 */
        #myBtn:hover {
            background-color: #a47bac;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(120, 80, 130, 0.18);
        }

        /* 按下按鈕 */
        #myBtn:active {
            transform: translateY(1px);
        }

        /* 計算結果卡片 */
        .container-output {
            background-color: #f0e1f1;
            margin-top: 20px;
            padding: 35px 20px;
            min-height: 150px;
            border-radius: 22px;
            text-align: center;
        }

        .result-title {
            font-size: 15px;
            margin-bottom: 20px;
        }

        #result {
            font-size: 30px;
            font-weight: bold;
            color: #79547e;
            overflow-wrap: anywhere;
        }

        /* 錯誤提示 */
        #result.error {
            color: #c46b85;
            font-size: 20px;
        }

        /* 手機版調整 */
        @media (max-width: 480px) {
            body {
                padding: 35px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .container-input {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>✦ 我的迷你計算機 ✦</h1>
        <p class="subtitle">Mini Calculator</p>

        <!-- 輸入區 -->
        <div class="container-input">

            <div class="field">
                <label for="num1">第一個數字</label>
                <input type="number" step="any" id="num1">
            </div>

            <div class="field">
                <label for="num2">第二個數字</label>
                <input type="number" step="any" id="num2">
            </div>

            <div class="field">
                <label for="opt">運算方式</label>
                <select id="opt">
                    <option value="+">＋ 加法</option>
                    <option value="-">－ 減法</option>
                    <option value="*">× 乘法</option>
                    <option value="/">÷ 除法</option>
                </select>
            </div>

            <button id="myBtn">✦ 開始計算 ✦</button>

        </div>

        <!-- 結果區 -->
        <div class="container-output">

            <div class="result-title">計算結果</div>

            <div id="result">等待計算...</div>

        </div>

    </div>

    <script>
        // 取得計算按鈕
        document.getElementById("myBtn").addEventListener("click", function () {

            // 取得輸入的數字和運算符號
            let input1 = document.getElementById("num1").value;
            let input2 = document.getElementById("num2").value;
            let opt = document.getElementById("opt").value;
            let result = document.getElementById("result");

            // 清除錯誤樣式
            result.classList.remove("error");

            // 檢查是否有輸入數字
            if (input1 === "" || input2 === "") {
                result.innerText = "請輸入兩個數字";
                result.classList.add("error");
                return;
            }

            // 將文字轉換成數字
            let num1 = Number(input1);
            let num2 = Number(input2);
            let answer;

            // 判斷運算方式
            if (opt === "+") {
                answer = num1 + num2;
            }
            else if (opt === "-") {
                answer = num1 - num2;
            }
            else if (opt === "*") {
                answer = num1 * num2;
            }
            else if (opt === "/") {

                // 除數不能是 0
                if (num2 === 0) {
                    result.innerText = "不能除以 0";
                    result.classList.add("error");
                    return;
                }

                answer = num1 / num2;
            }

            // 運算符號顯示
            let symbol = opt;

            if (opt === "*") {
                symbol = "×";
            }
            else if (opt === "/") {
                symbol = "÷";
            }

            // 顯示計算結果
            result.innerText = num1 + " " + symbol + " " + num2 + " = " + answer;

        });
    </script>

</body>
</html>
