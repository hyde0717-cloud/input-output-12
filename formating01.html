<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
table {
    width: 80%;
    border-spacing: 5px;
    table-layout: fixed;
    margin: auto;
}
tr,
td {
    height: 20vh;
}
.box {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    overflow: hidden;
}
.box11 {
    background-color: lightblue;
}
.box21 {
    background-color: rgb(240, 198, 205);
}
.box22 {
    background-color: rgb(248, 182, 208);
}
.box31 {
    background-color: rgb(174, 159, 209);
}
.box32 {
    background-color: rgb(128, 103, 226);
}
.box33 {
    background-color: rgba(52, 71, 241, 0.767);
}
.box41 {
    background-color: rgb(194, 224, 193);
}
.box42 {
    background-color: rgb(150, 221, 188);
}
.box43 {
    background-color: rgb(84, 185, 126);
}
.box44 {
    background-color: rgb(24, 168, 120);
}
    </style>
</head>
<body>
    <table>
        <tr>
            <td>
                <div class="box box11">
            </div>
        </td>
        </tr>
        </table>
        <table>
    <tr>
        <td width="50%">
            <div class="box box21">
            </div>
        </td>

        <td width="50%">
            <div class="box box22">
            </div>
        </td>
    </tr>
</table>
<table>
    <tr>
        <td width="33%">
            <div class="box box31">  
            </div>
        </td>

        <td width="33%">
            <div class="box box32">
            </div>
        </td>

        <td width="33%">
            <div class="box box33">
            </div>
        </td>
    </tr>
</table>
    <table>
         <tr>
            <td width="25%">
                <div class="box box41">
                </div>
            </td>
                <td width="25%">
                <div class="box box42"> 
                </div>
            </td>
                <td width="25%">
                <div class="box box43">
                </div>
            </td>
            </td>
                <td width="25%">
                <div class="box box44">
                </div>
            </td>
            </tr>
    </table>
</body>
</html>
