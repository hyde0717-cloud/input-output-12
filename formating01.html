<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h3>b</h3>
<p>
    <b>慢慢走，</b>也能遇見好風景。
</p>
<h3>strong</h3>
<p>
    <strong> 慢慢走，</strong>也能遇見好風景。
</p>
<h3>i</h3>
<p>
  <i> 慢慢走，</i>也能遇見好風景。
</p>
<h3>em</h3>
<p>
  <em> 慢慢走，</em>也能遇見好風景。
</p>
<h3>mark</h3>
<p>
  <mark> 慢慢走，</mark>也能遇見好風景。
</p>
<h3>small</h3>
<p>
  <small> 慢慢走，</small>也能遇見好風景。
</p>
<h3>del</h3>
<p>
  <del> 慢慢走，</del>也能遇見好風景。
</p>
<h3>ins</h3>
<p>
  <ins> 慢慢走，</ins>也能遇見好風景。
</p>
<h3>sub</h3>
<p>
   慢<sub>慢</sub>走，也能遇見好風景。
</p>
<h3>sup</h3>
<p>
   慢<sup>慢</sup>走，也能遇見好風景。
</p>
<h3>顏文字</h3>
<p>
    ㅍ_ㅍ
</p>

</body>
</html>
